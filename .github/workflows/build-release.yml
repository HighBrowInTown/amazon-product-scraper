name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --console --name "AmazonScraper" amazon_exporter.py
    
    - name: Get version from tag
      id: get_version
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Release Archive
      shell: bash
      run: |
        mkdir release
        cp dist/AmazonScraper.exe release/
        cp README.md release/
        cp LICENSE release/ 2>/dev/null || echo "No LICENSE file"
        cd release
        7z a ../AmazonScraper-${{ steps.get_version.outputs.VERSION }}-windows.zip *
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AmazonScraper-Windows
        path: |
          dist/AmazonScraper.exe
          AmazonScraper-*.zip
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          AmazonScraper-*.zip
          dist/AmazonScraper.exe
        body: |
          ## Amazon Product Details Scraper ${{ steps.get_version.outputs.VERSION }}
          
          ### Downloads
          - Windows EXE: `AmazonScraper.exe` (standalone, no Python required)
          - ZIP Package: Includes EXE, README, and LICENSE
          
          ### Features
          - Scrape Amazon India product details
          - Extract: Title, Price, Rating, Review Count, Bestseller Rank, Categories
          - Batch processing from file or single URL
          - Export to formatted Excel
          - Headless browser operation
          
          ### Quick Start
          1. Download `AmazonScraper.exe`
          2. Run from command line:
             AmazonScraper.exe --input "https://www.amazon.in/dp/B0CZL9BM4S"
          3. Check the generated Excel file
          
          ### Requirements
          - Windows 10/11
          - Google Chrome browser installed
          - Internet connection
          
          ### Usage Examples
          - Single URL: `AmazonScraper.exe --input "URL"`
          - Batch from file: `AmazonScraper.exe --input "urls.txt"`
          - Custom output: `AmazonScraper.exe --input "urls.txt" --output "results.xlsx"`
          
          See README.md for full documentation.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Linux Executable
      run: |
        pyinstaller --onefile --console --name "AmazonScraper" amazon_exporter.py
    
    - name: Get version from tag
      id: get_version
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Release Archive
      run: |
        mkdir release
        cp dist/AmazonScraper release/
        cp README.md release/
        cp LICENSE release/ 2>/dev/null || echo "No LICENSE file"
        cd release
        tar -czf ../AmazonScraper-${{ steps.get_version.outputs.VERSION }}-linux.tar.gz *
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AmazonScraper-Linux
        path: |
          dist/AmazonScraper
          AmazonScraper-*.tar.gz
        retention-days: 30
    
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          AmazonScraper-*.tar.gz
          dist/AmazonScraper
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}